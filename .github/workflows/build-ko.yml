name: Build uid_guard_cfg.ko

# 单独编出 uid_guard_cfg.ko（不打内核补丁，也不需要改内核树）。
#
# 为什么能不打补丁：模块用一次性 kprobe 按名字找 uid_guard_set，编译期
# 不引用该符号，所以 Module.symvers 里有没有它都无所谓。补丁只需要打在
# **目标内核**上（提供函数本体），与编译无关。
#
# 为什么仍然要编内核：外部模块编译需要 Module.symvers（每个导出符号的
# CRC）和 include/generated/，这两样只能由 modpost 阶段产出，而官方 GKI
# 只发布 Image，不发符号表。所以首次必须编一次内核，之后靠缓存跳过。
#
# 产物适用范围：同 KMI（android12-5.10）内的任意 5.10.x GKI 内核。GKI 保证
# KMI 内 module_layout 等符号的 CRC 稳定，vermagic 里的版本号部分又会被
# same_magic() 跳过（CONFIG_MODVERSIONS=y 时只比对
# "SMP preempt mod_unload modversions aarch64"），所以用 5.10.198 的树
# 编出来的 .ko 在 5.10.272 上照样能加载。

on:
  workflow_dispatch:
    inputs:
      force_rebuild_kernel:
        description: "忽略缓存，强制重新构建内核符号表"
        required: false
        type: boolean
        default: false
      upload_release:
        description: "构建成功后创建 Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 与 build.config.common 保持一致。缺了它算出的符号 CRC 可能与官方不同，
  # 模块加载时会报 disagrees about version of symbol。
  KCFLAGS: "-D__ANDROID_COMMON_KERNEL__"
  ARCH: arm64
  LLVM: "1"
  LLVM_IAS: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 腾出磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache python3 git curl build-essential \
            libssl-dev bison flex libelf-dev dwarves zip kmod

      - name: 下载 repo 工具
        run: |
          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"

      - name: 解析最新 manifest 分支
        id: mf
        run: |
          set -euo pipefail
          # 不再让人挑月份：同 KMI 内产物通用，取最新稳定分支即可
          month=$(git ls-remote --heads \
                    https://android.googlesource.com/kernel/manifest \
                    "refs/heads/common-android12-5.10-*" |
                  awk -F/ '{print $3}' | sort -V | tail -n1 |
                  sed 's/^common-android12-5.10-//')
          if [ -z "$month" ]; then
            echo "::error::无法确定 manifest 月份"
            exit 1
          fi
          echo "month=$month" >> "$GITHUB_OUTPUT"
          echo "branch=common-android12-5.10-$month" >> "$GITHUB_OUTPUT"
          echo "使用 manifest 分支: common-android12-5.10-$month"

      - name: repo init / sync
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/gki"
          cd "$GITHUB_WORKSPACE/gki"
          repo init --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${{ steps.mf.outputs.branch }}" \
            --repo-rev=v2.16
          repo sync -c -j"$(nproc --all)" --no-tags --fail-fast
          awk '/^VERSION = /{v=$3} /^PATCHLEVEL = /{p=$3} /^SUBLEVEL = /{s=$3} \
               END{print "内核版本: " v "." p "." s}' common/Makefile

      - name: 恢复内核符号表缓存
        id: kcache
        if: inputs.force_rebuild_kernel == false
        uses: actions/cache@v4
        with:
          # 只缓存编外部模块真正需要的东西：.config、符号表、生成的头文件。
          # 不缓存整个 out/，那有几十 GB。
          path: |
            out/.config
            out/Module.symvers
            out/include/generated
            out/arch/arm64/include/generated
            out/scripts
            out/.scmversion
          key: gki-kbuild-${{ steps.mf.outputs.month }}-v1

      - name: 构建内核符号表
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/gki/common"
          O="$GITHUB_WORKSPACE/out"
          make O="$O" gki_defconfig
          # vmlinux 把 built-in 全部落地，modules 阶段跑 modpost 产出
          # Module.symvers —— 外部模块编译要的正是这个文件
          make O="$O" -j"$(nproc --all)" vmlinux modules
          test -s "$O/Module.symvers" || {
            echo "::error::没有产出 Module.symvers"
            ls -l "$O" | head -40
            exit 1
          }
          echo "Module.symvers 行数: $(wc -l < "$O/Module.symvers")"

      - name: 校验内核产物
        run: |
          set -euo pipefail
          O="$GITHUB_WORKSPACE/out"
          for f in .config Module.symvers include/generated/autoconf.h \
                   include/generated/utsrelease.h; do
            if [ -f "$O/$f" ]; then
              echo "  OK   $f"
            else
              echo "::error::缺少 $f"
              exit 1
            fi
          done

      - name: 编译 uid_guard_cfg.ko
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/gki/common"
          O="$GITHUB_WORKSPACE/out"
          make O="$O" M="$GITHUB_WORKSPACE/src" modules
          ko="$GITHUB_WORKSPACE/src/uid_guard_cfg.ko"
          test -f "$ko" || { echo "::error::没有产出 uid_guard_cfg.ko"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$ko" "$GITHUB_WORKSPACE/dist/"
          ls -l "$GITHUB_WORKSPACE/dist/"
          echo "--- modinfo ---"
          modinfo "$ko" || strings "$ko" | grep -E '^(vermagic|name|license)='

      - name: 打包模块 zip
        run: |
          set -euo pipefail
          sh "$GITHUB_WORKSPACE/build_module_zip.sh" \
             "$GITHUB_WORKSPACE/dist/uid_guard_cfg.ko"
          ls -l "$GITHUB_WORKSPACE"/uid_guard_*.zip

      - name: 上传产物
        uses: actions/upload-artifact@v8
        with:
          name: uid_guard-ko-${{ steps.mf.outputs.month }}
          path: |
            dist/uid_guard_cfg.ko
            uid_guard_*.zip
          if-no-files-found: error

      - name: 创建 Release
        if: inputs.upload_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ko-${{ steps.mf.outputs.month }}
          name: uid_guard_cfg.ko (${{ steps.mf.outputs.month }})
          body: |
            由 GitHub Actions 从官方 GKI 源码编译，**不打内核补丁**。

            模块用一次性 kprobe 按名字查找 `uid_guard_set`，编译期不引用该符号，
            因此编译用的内核树不需要打 0014 补丁——补丁只需要打在目标内核上。

            适用范围：android12-5.10 KMI 内的任意 5.10.x GKI 内核。GKI 保证 KMI 内
            `module_layout` 等符号的 CRC 稳定，vermagic 的版本号部分又会被
            `same_magic()` 跳过，所以跨小版本可以直接加载。
          files: uid_guard_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

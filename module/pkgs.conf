# uid_guard 名单：每行一个包名，与 HMA 的隐藏列表保持一致
#
# - 只放第三方 app。系统组件（例如 AID_SYSTEMUI 10139）不要放进来，
#   否则会出现“系统组件报告未运行”的不可能事件。
# - 纯数字视为 base uid（user 0 的 app uid），用于包只装在 work profile、
#   或者在 packages.list 里查不到的场景。
# - 名单按 base uid 生效：同一个包在所有用户 / 工作资料里的副本一起隐藏。
# - 名单为空 = 功能关闭（fail-open），不会变成“全量隐藏”。
#
# 改完重启，或者执行：
#   su -c sh /data/adb/modules/uid_guard/service.sh
#
# 示例：
# com.example.target_a
# com.example.target_b
# 1010234
